[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "duplver"
version = "0.2.0"
description = "Find, classify and safely clean up duplicate images."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Duplver" }]
keywords = ["duplicate", "deduplication", "images", "perceptual-hash", "clip", "cli"]

# Only Pillow is strictly required; the rest make Duplver faster and smarter
# and are always included in the Windows executable.
dependencies = [
    "pillow>=10.3",
    "pillow-heif>=0.16",              # HEIC/HEIF (iPhone) photos
    "numpy>=1.26",                    # fast hash matching
    "opencv-python-headless>=4.9",    # crop / edit verification
    "send2trash>=1.8",                # clean --recycle-bin
]

[project.optional-dependencies]
ai = [                                # CLIP similarity: crops, heavy edits, similar shots
    "torch>=2.1",
    "open_clip_torch>=2.24",
]
build = ["pyinstaller>=6.6"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
duplver = "duplver.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py39"
